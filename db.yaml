######################################################################
# Awesome Erlang YAML database
#
# The goal of this file is to have an easy way to deal with all
# information in one place, using an easy text-like format. This
# file will then be used to generate README.md or JSON files.
#
######################################################################
_parameters:
  title: "Awesome Erlang List"
  summary: |
     A curated list of amazingly awesome Erlang libraries, resources and shiny
     things.
  project_url: "https://github.com/erlang-punch/awesome-erlang"
  web_url: "https://erlang-punch.github.io"

# when generating readme.md
_readme_params:
  toc: true

# when generating a json
