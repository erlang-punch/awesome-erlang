  - date: 1997
    title: "The development of Erlang"
    url: "https://dl.acm.org/doi/10.1145/258948.258967"
    keywords: [history, erlang, design, influences, logic programming, functional programming, chill, ada]
    abstract: ""
    summary: |
      This paper describes the development of the programming language Erlang
      during the period 1985-1997. Erlang is a concurrent programming language
      designed for programming large-scale distributed soft real-time control
      applications. The design of Erlang was heavily influenced by ideas from
      the logic and functional programming communities. Other sources of
      inspiration came from languages such as Chill and Ada which are used in
      industry for programming control systems.
    authors: []
      - "Joe Armstrong"

